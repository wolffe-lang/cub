# tests/lair.conf — what the engine's tools need to know about cub, as shell
# KEY=VALUE lines (tools/perf, tools/pty and tools/perf-idle read it).
# RUN_ARGS: passed to every run the pty rows start: a separate save,
# --mute so the engine's rows play no music (the game's sound rows do),
# and --no-title so they press keys into the game, not the title (cb04).
# TRAP_AT: the trap row's planted tick.
# AGREE_CASE, AGREE_TICKS: the agree rows' replay and its length.
# BENCH_ARGS: the perf gate's bench (cb01, when `--bench` arrives).
RUN_ARGS="--save target/pty/engine.save --mute --no-title"
TRAP_AT=20
AGREE_CASE=walk-north
AGREE_TICKS=120
BENCH_ARGS=""
